x-kafka_controller:
  entrypoint: &kafka-controller-entrypoint
    [ "/bin/bash", "-c", "unset KAFKA_ADVERTISED_LISTENERS; exec /etc/confluent/docker/run" ]
  env: &kafka_controller-env
    CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-c-1:9093"
    KAFKA_LISTENERS: "CONTROLLER://:9093"
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT"
    KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
    KAFKA_PROCESS_ROLES: "controller"

x-kafka_broker:
  env: &kafka-broker-env
    CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-c-1:9093"
    KAFKA_LISTENERS: "PLAINTEXT://:9092,EXTERNAL://:9094,SSL://:9093"
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT,SSL:SSL"
    KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
    KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
    KAFKA_PROCESS_ROLES: "broker"
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_SSL_KEYSTORE_FILENAME: kafka.kafka-b.keystore.pkcs12
    KAFKA_SSL_KEYSTORE_CREDENTIALS: kafka-b_keystore_creds
    KAFKA_SSL_KEY_CREDENTIALS: kafka-b_sslkey_creds
    KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.kafka-b.truststore.jks
    KAFKA_SSL_TRUSTSTORE_CREDENTIALS: kafka-b_truststore_creds
    KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https

services:
  kafka-c-1:
    image: confluentinc/cp-kafka:8.3.0
    entrypoint: *kafka-controller-entrypoint
    container_name: kafka-c-1
    hostname: kafka-c-1
    environment:
      <<: *kafka_controller-env
      KAFKA_NODE_ID: 1
    volumes:
      - kafka-c-1-data:/var/lib/kafka/data
      - kafka-c-1-secrets:/etc/kafka/secrets
    networks:
      - kafka-network
    restart: unless-stopped

  kafka-b-1:
    image: confluentinc/cp-kafka:8.3.0
    container_name: kafka-b-1
    hostname: kafka-b-1
    environment:
      <<: *kafka-broker-env
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-b-1:9092,EXTERNAL://127.0.0.1:19094,SSL://kafka-b-1:9093"
      KAFKA_NODE_ID: 4
    volumes:
      - kafka-b-1-data:/var/lib/kafka/data
      - ./ca/kafka-b-1-creds:/etc/kafka/secrets
    networks:
      - kafka-network
    restart: unless-stopped
    ports:
      - "19094:9094"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: "kafka-b-1:9093"
      KAFKA_CLUSTERS_0_NAME: "kafka-kraft"
      DYNAMIC_CONFIG_ENABLED: 'true'
      
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: "SSL"
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_LOCATION: "/etc/kafka/secrets/kafka.kafka-b.truststore.jks"
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_PASSWORD: "kafka123"
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_TYPE: "JKS"
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEYSTORE_LOCATION: "/etc/kafka/secrets/kafka.kafka-b.keystore.pkcs12"
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEYSTORE_PASSWORD: "kafka123"
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEYSTORE_TYPE: "PKCS12"
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEY_PASSWORD: "kafka123"
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: "https"
    volumes:
      - ./ca/kafka-b-1-creds:/etc/kafka/secrets
    networks:
      - kafka-network
    restart: unless-stopped
    depends_on:
      - kafka-c-1

volumes:
  kafka-c-1-data:
  kafka-c-1-secrets:
  kafka-b-1-data:

networks:
  kafka-network:
    driver: bridge