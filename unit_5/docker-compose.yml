      KAFKA_LISTENERS: "CONTROLLER://:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_PROCESS_ROLES: "controller"
      # SSL настройки
      KAFKA_SSL_KEYSTORE_FILENAME: "ssl/keystore.p12"
      KAFKA_SSL_KEYSTORE_TYPE: "PKCS12"
      KAFKA_SSL_KEYSTORE_CREDENTIALS: "creds/keystore_creds"
      KAFKA_SSL_KEY_CREDENTIALS: "creds/ssl_key_creds"
      
      KAFKA_SSL_TRUSTSTORE_FILENAME: "ssl/truststore.p12"
      KAFKA_SSL_TRUSTSTORE_TYPE: "PKCS12"
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: "creds/truststore_creds"
      
      KAFKA_CONTROLLER_SSL_CLIENT_AUTH: "none"
      KAFKA_SSL_CLIENT_AUTH: "none"
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: "HTTPS"
      KAFKA_SSL_VERIFY_HOSTNAME: "true"
      KAFKA_SSL_TRUSTMANAGER_ALGORITHM: "PKIX"
      
      KAFKA_SSL_ENABLED_PROTOCOLS: "TLSv1.3,TLSv1.2"
      KAFKA_SSL_CIPHER_SUITES: "TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"
      KAFKA_SSL_KEYMANAGER_ALGORITHM: "SunX509"
      KAFKA_OPTS: "-Djdk.tls.client.cipherSuites=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256 -Djdk.tls.server.cipherSuites=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"
    volumes:
        - kafka-c-2-data:/var/lib/kafka/data
        - ./ssl/controllers/kafka-c-2:/etc/kafka/secrets
    networks:
      - kafka-network
    restart: unless-stopped
  kafka-c-3:
    image: confluentinc/cp-kafka:8.3.0
    # Для роли контроллера "KAFKA_ADVERTISED_LISTENERS" должна отсутствовать, но в поставке cp-kafka, она все равно создается. Поэтому вот так удаляем ее.
    entrypoint: [ "/bin/bash", "-c", "unset KAFKA_ADVERTISED_LISTENERS; exec /etc/confluent/docker/run" ]
    container_name: kafka-c-3
    hostname: kafka-c-3
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 3
