global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'kafka-cluster-1'
    static_configs:
      - targets:
          - 'kafka-b-1:7071'
          - 'kafka-c-1:7071'
        labels:
          cluster: 'kafka-1'

  - job_name: 'kafka-cluster-2'
    static_configs:
      - targets:
          - 'kafka2-b-1:7071'
          - 'kafka2-c-1:7071'
        labels:
          cluster: 'kafka-2'
rule_files:
  - 'rules/kafka-alerts.yml'
